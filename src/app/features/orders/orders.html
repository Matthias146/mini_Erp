<section class="orders">
  <h1>Aufträge</h1>

  <table mat-table [dataSource]="dataSource" class="orders-table">
    <ng-container matColumnDef="orderNumber">
      <th mat-header-cell *matHeaderCellDef>Auftragsnummer</th>
      <td mat-cell *matCellDef="let order">{{ order.orderNumber }}</td>
    </ng-container>

    <ng-container matColumnDef="customer">
      <th mat-header-cell *matHeaderCellDef>Kunde</th>
      <td mat-cell *matCellDef="let order">{{ order.customer }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let order">
        <app-status-badge
          [label]="getStatusLabel(order.status)"
          [variant]="getStatusVariant(order.status)"
        />
      </td>
    </ng-container>

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Datum</th>
      <td mat-cell *matCellDef="let order">{{ order.date | date: 'dd.MM.yyyy' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</section>
