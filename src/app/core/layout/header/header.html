<mat-toolbar color="primary">
  <span>Logistik ERP</span>
  <span class="spacer"></span>
  @if (currentUser(); as user) {
    <a routerLink="/profile" class="username">{{ user.username }}</a>
  }
  <button mat-icon-button (click)="logout()" aria-label="Abmelden">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
