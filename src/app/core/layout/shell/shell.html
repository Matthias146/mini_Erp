<app-header [showMenuButton]="isMobile()" (menuToggle)="sidenav.toggle()" />

<mat-sidenav-container class="shell-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="shell-sidenav"
  >
    <app-sidebar />
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <main>
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
